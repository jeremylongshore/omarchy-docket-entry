<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" role="img" aria-labelledby="title desc">
  <title id="title">Docket</title>
  <desc id="desc">Three ordered pull request lanes moving from review through blocked work to merge ready.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100d1a"/>
      <stop offset="1" stop-color="#24152d"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="400" rx="30" fill="url(#bg)"/>
  <path d="M38 64H1362M38 336H1362" stroke="#4c3b56" stroke-width="2"/>
  <circle cx="80" cy="72" r="7" fill="#e879f9"/>
  <circle cx="104" cy="72" r="7" fill="#f59e0b"/>
  <circle cx="128" cy="72" r="7" fill="#34d399"/>

  <text x="80" y="162" fill="#f8f5ff" font-family="ui-monospace, monospace" font-size="74" font-weight="700" letter-spacing="5">DOCKET</text>
  <text x="82" y="211" fill="#c9bdd2" font-family="ui-monospace, monospace" font-size="24" letter-spacing="2">OLDEST OBLIGATION FIRST</text>
  <path d="M82 250H540" stroke="url(#trail)" stroke-width="10" stroke-linecap="round"/>
  <text x="82" y="300" fill="#e879f9" font-family="ui-monospace, monospace" font-size="19">REVIEW</text>
  <text x="232" y="300" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="19">BLOCKED</text>
  <text x="412" y="300" fill="#34d399" font-family="ui-monospace, monospace" font-size="19">READY</text>

  <g transform="translate(700 82)">
    <rect x="0" y="0" width="196" height="236" rx="16" fill="#1b1424" stroke="#e879f9" stroke-width="2"/>
    <text x="18" y="34" fill="#e879f9" font-family="ui-monospace, monospace" font-size="15">WAITING REVIEW</text>
    <rect x="18" y="56" width="160" height="48" rx="8" fill="#2d2038"/>
    <circle cx="34" cy="80" r="5" fill="#e879f9"/>
    <path d="M50 73H157M50 86H127" stroke="#c9bdd2" stroke-width="5" stroke-linecap="round"/>
    <rect x="18" y="118" width="160" height="48" rx="8" fill="#2d2038"/>
    <circle cx="34" cy="142" r="5" fill="#f43f5e"/>
    <path d="M50 135H145M50 148H117" stroke="#c9bdd2" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(914 82)">
    <rect x="0" y="0" width="196" height="236" rx="16" fill="#1b1424" stroke="#f59e0b" stroke-width="2"/>
    <text x="18" y="34" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="15">BLOCKED ON YOU</text>
    <rect x="18" y="56" width="160" height="48" rx="8" fill="#2d2038"/>
    <path d="M32 80H44M50 73H157M50 86H127" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <rect x="18" y="118" width="160" height="48" rx="8" fill="#2d2038"/>
    <path d="M32 142H44M50 135H145M50 148H117" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(1128 82)">
    <rect x="0" y="0" width="196" height="236" rx="16" fill="#1b1424" stroke="#34d399" stroke-width="2"/>
    <text x="18" y="34" fill="#34d399" font-family="ui-monospace, monospace" font-size="15">READY TO MERGE</text>
    <rect x="18" y="56" width="160" height="48" rx="8" fill="#20352f"/>
    <path d="M30 80L38 88L50 70M60 74H158M60 87H132" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="118" width="160" height="48" rx="8" fill="#20352f"/>
    <path d="M30 142L38 150L50 132M60 136H145M60 149H118" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
